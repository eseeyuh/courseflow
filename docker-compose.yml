# CourseFlow local stack: PostgreSQL + pgvector, a one-shot migration job and
# the API. The frontend runs on the host (`npm run dev` in frontend/) for fast
# reloads.
#
# Startup order: db (healthy) -> migrate (alembic upgrade head, exits 0) -> api.
# If the migration fails, the API is not started.
#
# Values come from the repository-root `.env` (copy `.env.example`). The
# `:-` fallbacks are DEVELOPMENT-ONLY so a fresh clone starts with one
# command; never reuse them anywhere reachable from a network.

name: courseflow

# Shared by `migrate` and `api`: one image, so migrations always ship with the
# application code they belong to.
x-backend: &backend
  build:
    context: ./backend
  image: courseflow-api:dev
  environment:
    APP_ENV: ${APP_ENV:-development}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Inside the Compose network the database host is the service name `db`.
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-courseflow}:${POSTGRES_PASSWORD:-courseflow-dev-only}@db:5432/${POSTGRES_DB:-courseflow}
    # Browser origin of the frontend dev server (runs on the host).
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-courseflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courseflow-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-courseflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only: host-side tests and Alembic need it; the LAN does not.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    # One-shot job: the image's HTTP healthcheck does not apply.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
