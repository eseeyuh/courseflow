# Alembic configuration for the CourseFlow API database.
#
# The database URL is NOT stored here. alembic/env.py reads DATABASE_URL from
# the environment (or repo-root .env) through app.core.config.Settings, so
# migrations and the application always target the same database.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
truncate_slug_length = 40

[post_write_hooks]
# Keep generated revision files consistent with the codebase.
hooks = ruff_format, ruff_check

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

# Logging for the alembic CLI only (the API configures its own logging).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
