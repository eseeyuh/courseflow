# CourseFlow hosted demo: the whole offline judge demo on one Docker host.
#
#     docker compose -f infra/demo/compose.yml up -d --build --wait
#
# db (PostgreSQL + pgvector) -> migrate (alembic upgrade head) -> api
# (APP_ENV=demo) -> seed (resets to the initial Northbridge state once) ->
# web (Next.js). The demo replays committed recordings: no model key, no
# network calls, no spend. It is NOT a live university LMS connection.
#
# Addresses are explicit. On a server, set the public URLs (see .env.example
# in this folder): the browser loads WEB_ORIGIN and calls API_PUBLIC_URL,
# and the API allows exactly WEB_ORIGIN (CORS). NEXT_PUBLIC_API_BASE_URL is
# compiled into the web image, so changing API_PUBLIC_URL needs --build.
# The demo endpoints (reset, simulated sync) are unauthenticated by design:
# anyone who can open the demo can reset it.

name: courseflow-demo

x-api-image: &api-image
  build:
    context: ../..
    dockerfile: infra/demo/api.Dockerfile
  image: courseflow-demo-api:local

x-api-environment: &api-environment
  APP_ENV: demo
  LOG_LEVEL: INFO
  DATABASE_URL: postgresql+asyncpg://courseflow:${DEMO_DB_PASSWORD:-courseflow-demo-only}@db:5432/courseflow_demo
  CORS_ALLOWED_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000}

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: courseflow
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:-courseflow-demo-only}
      POSTGRES_DB: courseflow_demo
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port: only the API reaches the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courseflow -d courseflow_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    <<: *api-image
    environment: *api-environment
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api-image
    environment: *api-environment
    volumes:
      - rawdata:/var/lib/courseflow/raw
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # One-shot: rebuild the initial demo state through the API's own reset
  # path (about 10 seconds), so the first visitor sees the courses.
  seed:
    <<: *api-image
    environment: *api-environment
    restart: "no"
    healthcheck:
      disable: true
    command:
      - python
      - -c
      - |
        import json, sys, urllib.request
        req = urllib.request.Request("http://api:8000/api/v1/demo/workflow-runs", data=b'{"reset": true}',
                                     headers={"Content-Type": "application/json"}, method="POST")
        result = json.load(urllib.request.urlopen(req, timeout=300))
        print("demo reset:", "succeeded" if result["succeeded"] else "FAILED")
        sys.exit(0 if result["succeeded"] else 1)
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/demo/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${API_PUBLIC_URL:-http://127.0.0.1:8000}
    image: courseflow-demo-web:local
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  pgdata:
  rawdata:
