# Northbridge University: a fictional institution for CourseFlow's demo and
# evaluation. Every document under courses/ is generated by
# backend/app/demo/generate.py from backend/app/demo/northbridge_content.py.
# Schema: demo-manifest/v1 (backend/app/connectors/demo.py).
schema_version: demo-manifest/v1
institution:
  key: northbridge
  name: Northbridge University
  fictional: true
# The demo's first import sees each resource as it was at this time; versions
# published later arrive as changes.
initial_sync_at: 2026-10-05T08:00:00Z
users:
  - user_ref: demo-student
    courses: [aml7001, msd7000]
courses:
